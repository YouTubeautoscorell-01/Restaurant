
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3B0A16">
  <title>Customer Login</title>

  <link rel="stylesheet" href="login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
  <main class="login-page">
    <section class="login-card">
      <div class="brand-icon">
        <i class="fa-solid fa-utensils"></i>
      </div>

      <p class="eyebrow">WELCOME</p>
      <h1>Self Ordering</h1>
      <p class="subtitle">Your favourite food, just a few taps away.</p>

      <form id="loginForm" novalidate>
        <label for="mobileNumber">Mobile Number</label>

        <div class="phone-field">
          <span class="country-code">+91</span>
          <span class="field-divider"></span>
          <input
            type="tel"
            id="mobileNumber"
            name="mobileNumber"
            inputmode="numeric"
            autocomplete="tel-national"
            placeholder="Enter 10-digit number"
            maxlength="10"
            minlength="10"
            pattern="[0-9]{10}"
            aria-describedby="loginError"
            required
          >
        </div>

        <p id="loginError" class="error-message" role="alert" hidden></p>

        <button type="submit" id="continueBtn">
          Continue <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <p class="privacy-note">
        <i class="fa-solid fa-lock"></i>
        Enter your mobile number to continue.
      </p>
    </section>

    <p class="bottom-note">A delicious experience awaits you.</p>
  </main>

  <script src="login.js"></script>
</body>
</html>
